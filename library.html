<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library — Published Coursework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared-core.css">
<style>
  body{
    display:flex; flex-direction:column; min-height:100vh; position:relative; overflow-x:hidden;
    background:linear-gradient(120deg, #FBF7F1 0%, #F0F4F0 100%);
    font-family:'Nunito',sans-serif;
  }
  main{ flex:1; padding:30px 24px; max-width:1100px; margin:0 auto; width:100%; }

  /* 📚 PAGE HEADER */
  .page-header{
    background:#fff; border-radius:16px; padding:26px 30px; margin-bottom:24px;
    box-shadow:0 4px 14px rgba(0,0,0,.05);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;
  }
  .header-left h2{
    margin:0 0 6px; font-family:'Baloo 2',cursive; font-size:22px; color:#453D57;
    display:flex; align-items:center; gap:10px;
  }
  .header-left p{ margin:0; font-size:14px; color:#6c6180; }
  .published-badge{
    background:#BFE9DA; color:#2E7D5B; padding:8px 18px; border-radius:20px;
    font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px;
  }

  /* 🔍 FILTER BAR */
  .filter-bar{
    background:#fff; border-radius:14px; padding:16px 20px; margin-bottom:24px;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
    display:flex; gap:12px; flex-wrap:wrap;
  }
  .filter-bar select{
    padding:8px 14px; border:1px solid #eee; border-radius:10px;
    font-family:inherit; font-size:14px; outline:none; transition:border .2s;
  }
  .filter-bar select:focus{ border-color:#FFC1B3; }
  .search-input{
    flex:1; min-width:180px; padding:8px 14px; border:1px solid #eee;
    border-radius:10px; font-family:inherit; font-size:14px; outline:none;
  }
  .search-input:focus{ border-color:#FFC1B3; }

  /* 📄 ENTRIES GRID */
  .entries-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px;
  }
  .entry-card{
    background:#fff; border-radius:14px; padding:20px; box-shadow:0 3px 10px rgba(0,0,0,.04);
    transition:transform .2s, box-shadow .2s;
  }
  .entry-card:hover{ transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.06); }
  .card-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .card-title{ font-family:'Baloo 2',cursive; font-size:16px; font-weight:700; color:#453D57; }
  .card-student{ font-size:13px; color:#6c6180; margin-bottom:8px; }
  .card-meta{ font-size:12px; color:#888; margin-bottom:14px; display:flex; gap:12px; flex-wrap:wrap; }
  .card-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn{
    padding:7px 14px; border-radius:10px; font-size:13px; font-weight:600;
    text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    border:none; cursor:pointer; transition:all .2s;
  }
  .btn-view{ background:#DCCFF2; color:#453D57; }
  .btn-view:hover{ background:#C9B8EE; }
  .btn-download{ background:#BFE9DA; color:#2E7D5B; }
  .btn-download:hover{ background:#A5E0C8; }
  .btn-unpublish{ background:#FFD4D4; color:#922C2C; }
  .btn-unpublish:hover{ background:#FFBFBF; }

  /* 📭 EMPTY STATE */
  .empty-box{
    background:#fff; border-radius:14px; padding:60px 30px; text-align:center;
    color:#888; box-shadow:0 2px 8px rgba(0,0,0,.04);
  }
  .empty-box h3{ font-family:'Baloo 2',cursive; font-size:18px; color:#453D57; margin:0 0 10px; }

  /* 📱 RESPONSIVE */
  @media(max-width:700px){
    .entries-grid{ grid-template-columns:1fr; }
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="pageEnter" class="page-enter">
  <div class="loading-orbit">
    <div class="cat-orbit black"><span>🐈‍⬛</span></div>
    <div class="cat-orbit orange"><span>🐈</span></div>
    <div class="yarn">🧶</div>
  </div>
</div>

<nav class="site-nav">
  <div class="nav-left">
    <a href="index.html" class="home-btn">🏡 Home</a>
  </div>
  <div class="nav-links">
    <a href="index.html">🏠 Home</a>
    <a href="about.html">ℹ️ About Us</a>
    <a href="dashboard.html">📚 Jobsheet</a>
    <a href="library.html" class="active">📖 Library</a>
  </div>
  <div class="nav-right">
    <button type="button" id="soundToggle" class="sound-toggle" title="Toggle meow sound"></button>
    <span id="authNavSlot"></span>
  </div>
</nav>

<main>
  <!-- 📚 PAGE HEADER -->
  <div class="page-header">
    <div class="header-left">
      <h2>📖 Published Coursework Library</h2>
      <p>View and download approved submissions from Sasha & Badrul</p>
    </div>
    <div class="published-badge" id="pubCount">0 Published</div>
  </div>

  <!-- 🔍 FILTER & SEARCH -->
  <div class="filter-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search jobsheets...">
    <select id="studentFilter">
      <option value="all">All Students</option>
      <option value="sasha">Sasha</option>
      <option value="badrul">Badrul</option>
    </select>
    <select id="sortBy">
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
      <option value="jobsheet">By Jobsheet #</option>
    </select>
  </div>

  <!-- 📄 PUBLISHED ENTRIES -->
  <div id="entriesContainer"></div>
</main>

<footer>
  <div class="stamp"><span class="dot"></span>DFD40143 • Cat House Portal • Sasha & Badrul</div>
</footer>

<script src="shared-core.js"></script>
<script>
(function(){
  // Get current user (for Admin controls)
  const currentUser = CatData.getSession();
  const users = CatData.getUsers();
  const isAdmin = currentUser && users[currentUser] && users[currentUser].role === 'admin';

  // Render all published entries
  renderLibrary();

  // Search & Filter handlers
  document.getElementById('searchInput').addEventListener('input', renderLibrary);
  document.getElementById('studentFilter').addEventListener('change', renderLibrary);
  document.getElementById('sortBy').addEventListener('change', renderLibrary);

  function renderLibrary(){
    const container = document.getElementById('entriesContainer');
    let entries = CatData.getLibrary(); // ✅ Uses EXISTING shared-core.js function!

    // Update published count
    document.getElementById('pubCount').textContent = `${entries.length} Published`;

    // Get filters
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const studentFilter = document.getElementById('studentFilter').value;
    const sortBy = document.getElementById('sortBy').value;

    // Apply filters
    entries = entries.filter(entry => {
      // Search filter
      if(search && !`jobsheet ${entry.jobsheetNum} ${entry.studentName}`.toLowerCase().includes(search)){
        return false;
      }
      // Student filter
      if(studentFilter !== 'all' && entry.studentId !== studentFilter){
        return false;
      }
      return true;
    });

    // Sort
    entries.sort((a, b) => {
      if(sortBy === 'newest') return new Date(b.publishedAt) - new Date(a.publishedAt);
      if(sortBy === 'oldest') return new Date(a.publishedAt) - new Date(b.publishedAt);
      if(sortBy === 'jobsheet') return a.jobsheetNum - b.jobsheetNum;
      return 0;
    });

    // Render
    if(entries.length === 0){
      container.innerHTML = `
        <div class="empty-box">
          <h3>📭 No Published Work Yet</h3>
          <p>Approved jobsheets will appear here once published by Admin.</p>
        </div>
      `;
      return;
    }

    // Build grid
    container.innerHTML = '<div class="entries-grid" id="entriesGrid"></div>';
    const grid = document.getElementById('entriesGrid');

    entries.forEach((entry, idx) => {
      const card = document.createElement('div');
      card.className = 'entry-card';
      card.innerHTML = `
        <div class="card-header">
          <div class="card-title">Jobsheet ${entry.jobsheetNum}</div>
          <span style="font-size:11px; background:#BFE9DA; color:#2E7D5B; padding:2px 8px; border-radius:10px; font-weight:700;">✅ Published</span>
        </div>
        <div class="card-student">👤 ${entry.studentName}</div>
        <div class="card-meta">
          📅 Uploaded: ${entry.uploadedDate || '—'}
          <br>
          📄 File: ${entry.fileName || 'Submitted PDF'}
        </div>
        <div class="card-actions">
          <a href="${entry.pdfData}" target="_blank" class="btn btn-view">📂 View PDF</a>
          <a href="${entry.pdfData}" download="${entry.fileName || `Jobsheet${entry.jobsheetNum}.pdf`}" class="btn btn-download">⬇️ Download</a>
          ${isAdmin ? `<button class="btn btn-unpublish" data-idx="${idx}">❌ Unpublish</button>` : ''}
        </div>
      `;
      grid.appendChild(card);
    });

    // Admin Unpublish handlers
    if(isAdmin){
      grid.querySelectorAll('.btn-unpublish').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.idx);
          if(confirm('❌ Unpublish this jobsheet?\nIt will be removed from the Public Library.')){
            const all = CatData.getLibrary();
            all.splice(idx, 1);
            CatData.saveLibrary(all);
            renderLibrary();
          }
        });
      });
    }
  }
})();
</script>
</body>
</html>
